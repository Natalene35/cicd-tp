name: CI with Allure Report
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Permissions nécessaires pour que l'action puisse commenter sur la PR et déployer sur GitHub Pages
permissions:
  pull-requests: write
  checks: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout du code
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Exécution des tests et génération des résultats Allure
      - name: Run tests with Allure
        run: npm test

      # 5. Génération du rapport Allure, publication du résumé sur la PR et upload du rapport
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 6. Déploiement du rapport sur GitHub Pages
      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/master' && success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
```

**Action requise :**
1.  Copiez ce contenu.
2.  Remplacez le fichier `.github/workflows/natWorkflow.yml` dans votre dépôt local.
3.  Committez et **poussez** les changements.
4.  Le pipeline devrait fonctionner correctement cette fois-ci.